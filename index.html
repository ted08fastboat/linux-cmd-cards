<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>命令卡 · 像背单词一样背 Linux 命令</title>
<meta name="description" content="Linux 命令记忆卡片：翻卡学习、三档评价、到点复习、听读音，113 个 RHCSA 常用命令。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%234f8cff%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27monospace%27 font-size=%2726%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27%3E%24_%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#08090e; --bg2:#0c0e15;
    --s1:#12141d; --s2:#171a25; --s3:#1d2130;
    --line:#232838; --line2:#2e3448;
    --tx:#eef1f7; --tx2:#a9b3c6; --tx3:#6c7690;
    --blu:#4f8cff; --cyn:#38d3d3; --vio:#a97bff;
    --red:#f0503c; --amb:#e8a317; --grn:#35c46a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.7;
    min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(700px 420px at 15% -8%, rgba(79,140,255,.16), transparent 65%),
      radial-gradient(620px 380px at 88% 4%, rgba(169,123,255,.10), transparent 62%),
      radial-gradient(800px 500px at 50% 110%, rgba(56,211,211,.06), transparent 60%)}
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

  /* ---------- top bar ---------- */
  .bar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid rgba(35,40,56,.7);
    backdrop-filter:blur(12px);background:rgba(8,9,14,.55)}
  .brand{display:flex;align-items:center;gap:10px;flex:none}
  .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(150deg,#4f8cff,#8b5cf6);color:#fff;font-family:var(--mono);
    font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(79,140,255,.32)}
  .brand b{font-size:14px;font-weight:700;display:block;line-height:1.25;letter-spacing:-.2px}
  .brand em{font-style:normal;font-size:10.5px;color:var(--tx3);letter-spacing:.06em}
  .spacer{flex:1}
  .pill{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);
    background:var(--s1);border:1px solid var(--line);padding:5px 11px;border-radius:999px;white-space:nowrap}
  .pill b{color:var(--tx);font-family:var(--mono);font-size:13px}
  .pill.fire{border-color:rgba(232,163,23,.32);background:rgba(232,163,23,.08);color:#f0c56a}
  .ibtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;
    background:var(--s1);border:1px solid var(--line);color:var(--tx2);font-size:15px;transition:.15s;flex:none}
  .ibtn:hover{background:var(--s3);color:var(--tx)}

  /* ---------- main ---------- */
  main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:20px 20px 40px;
    display:flex;flex-direction:column;justify-content:center}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{font-family:var(--sans);font-size:12.5px;color:var(--tx3);background:none;border:0;
    padding:5px 13px;border-radius:7px;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button:hover{color:var(--tx2)}
  .seg button.on{background:var(--s3);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  select{font-family:var(--sans);font-size:12.5px;color:var(--tx2);background:var(--s1);
    border:1px solid var(--line);padding:6px 10px;border-radius:9px;cursor:pointer;outline:none}
  select:focus{border-color:var(--line2)}

  /* session progress */
  .sprog{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:11.5px;color:var(--tx3)}
  .sprog .tr{flex:1;height:3px;border-radius:9px;background:#181c27;overflow:hidden}
  .sprog .tr i{display:block;height:100%;width:0;border-radius:9px;
    background:linear-gradient(90deg,var(--blu),var(--cyn));transition:width .4s ease}
  .sprog b{font-family:var(--mono);color:var(--tx2);font-weight:500}

  /* ---------- card ---------- */
  .card{perspective:1600px;height:min(404px,56vh);min-height:340px;cursor:pointer;user-select:none}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .58s cubic-bezier(.3,.1,.2,1)}
  .card.flip .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:22px;border:1px solid var(--line);overflow:hidden;
    background:linear-gradient(170deg,#151926 0%,#11141d 55%,#0e1119 100%);
    box-shadow:0 24px 60px -22px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.02) inset;
    display:flex;flex-direction:column;padding:30px 32px}
  .front{align-items:center;justify-content:center;text-align:center;padding-top:56px}
  .front::before{content:"";position:absolute;inset:-40% 20% 45% 20%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(79,140,255,.16),transparent);pointer-events:none}
  .back{transform:rotateY(180deg);overflow-y:auto;padding-top:54px}
  .back::-webkit-scrollbar{width:5px}
  .back::-webkit-scrollbar-thumb{background:#2a3145;border-radius:3px}

  .chip{position:absolute;top:20px;left:24px;font-size:11px;letter-spacing:.1em;color:var(--cyn);
    background:rgba(56,211,211,.09);border:1px solid rgba(56,211,211,.26);
    padding:2px 9px;border-radius:6px;font-weight:600}
  .cmd{font-family:var(--mono);font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-1px;
    line-height:1.15;word-break:break-word;margin-top:-6px;
    background:linear-gradient(180deg,#fff,#9fb4d8);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;margin:8px 0 4px}
  .say{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12px;
    color:var(--blu);background:rgba(79,140,255,.09);border:1px solid rgba(79,140,255,.28);
    padding:5px 12px;border-radius:999px;cursor:pointer;margin-top:18px;transition:.15s}
  .say:hover{background:rgba(79,140,255,.18)}
  .say.playing{color:var(--cyn);border-color:rgba(56,211,211,.4)}
  .hintline{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11.5px;color:#525d75}

  .desc{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:6px 0 18px;line-height:1.45}
  .row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
  .row .lb{font-size:10.5px;color:var(--tx3);letter-spacing:.12em;flex:none;width:30px;padding-top:8px}
  .row code{flex:1;font-family:var(--mono);font-size:13px;color:#ffd28a;background:#0b0e15;
    border:1px solid #1e2432;border-radius:8px;padding:8px 11px;word-break:break-word;
    white-space:pre-wrap;line-height:1.65}
  .row.ex code{color:#8fd9c0}
  .note{font-size:12.5px;color:#e0a3a3;background:rgba(240,80,60,.07);border:1px solid rgba(240,80,60,.2);
    border-radius:8px;padding:8px 12px;margin-top:2px;line-height:1.7}
  .bwrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
  .bmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;
    color:var(--tx3);padding-top:11px;margin-top:10px;border-top:1px solid #1c2231;letter-spacing:.02em}
  #boxTx{font-family:var(--mono);color:var(--tx2)}
  .rel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .rel em{font-style:normal;font-size:10.5px;color:var(--tx3);letter-spacing:.1em}
  .rel span{font-family:var(--mono);font-size:11px;color:#8b96ab;background:#141925;border:1px solid #232a38;padding:2px 8px;border-radius:6px}

  /* ---------- grade ---------- */
  .grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;opacity:0;
    pointer-events:none;transform:translateY(6px);transition:.25s}
  .grade.on{opacity:1;pointer-events:auto;transform:none}
  .grade button{font-family:var(--sans);font-size:14px;font-weight:600;padding:13px 8px;border-radius:13px;
    cursor:pointer;border:1px solid;background:transparent;transition:.15s;display:flex;
    align-items:center;justify-content:center;gap:7px}
  .grade kbd{font-family:var(--mono);font-size:10px;opacity:.55;border:1px solid currentColor;
    border-radius:4px;padding:0 4px;line-height:1.5}
  .g1{color:#ff8a7a;border-color:rgba(240,80,60,.35);background:rgba(240,80,60,.07)}
  .g1:hover{background:rgba(240,80,60,.17)}
  .g2{color:#f0c56a;border-color:rgba(232,163,23,.35);background:rgba(232,163,23,.07)}
  .g2:hover{background:rgba(232,163,23,.17)}
  .g3{color:#5fdc8f;border-color:rgba(53,196,106,.4);background:rgba(53,196,106,.09)}
  .g3:hover{background:rgba(53,196,106,.2)}

  /* ---------- done / empty ---------- */
  .done{text-align:center;padding:40px 20px}
  .done .big{font-size:52px;line-height:1;margin-bottom:18px;color:var(--grn)}
  .done h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.3px}
  .done p{color:var(--tx2);font-size:14px;margin-bottom:24px}
  .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:11px;
    cursor:pointer;border:1px solid var(--line2);background:var(--s2);color:var(--tx);transition:.15s}
  .btn:hover{background:var(--s3)}
  .btn.primary{background:linear-gradient(180deg,#4f8cff,#3b6fd8);border-color:#3b6fd8;color:#fff;
    box-shadow:0 6px 20px -8px rgba(79,140,255,.7)}
  .btn.primary:hover{filter:brightness(1.08)}

  /* ---------- stats ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
  .stat{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .stat b{display:block;font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.5px}
  .stat span{font-size:11.5px;color:var(--tx3)}
  .catrow{margin-bottom:13px}
  .catrow .h{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--tx2)}
  .catrow .h b{font-family:var(--mono);font-size:11.5px;color:var(--tx3);font-weight:500}
  .catrow .b{height:6px;border-radius:9px;background:#161a24;overflow:hidden}
  .catrow .b i{display:block;height:100%;border-radius:9px;
    background:linear-gradient(90deg,var(--blu),var(--cyn));transition:width .5s}
  .sectitle{font-size:12px;letter-spacing:.12em;color:var(--tx3);font-weight:700;margin:26px 0 12px;
    display:flex;align-items:center;gap:8px}
  .sectitle::before{content:"";width:3px;height:12px;background:var(--blu);border-radius:2px}

  footer{padding:10px 22px 18px;text-align:center;font-size:11px;color:#4a5468}
  kbd.k{font-family:var(--mono);font-size:10px;border:1px solid #2b3245;border-bottom-width:2px;
    border-radius:4px;padding:0 4px;color:var(--tx3);margin:0 2px}

  /* ---------- quiz ---------- */
  .qcard{background:linear-gradient(170deg,#151926,#11141d);border:1px solid var(--line);
    border-radius:20px;padding:26px 28px;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
  .qlabel{font-size:11px;letter-spacing:.12em;color:var(--tx3);margin-bottom:10px}
  .qprompt{font-family:var(--mono);font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.6px;
    line-height:1.25;word-break:break-word;color:#fff}
  .qprompt.cn{font-family:var(--sans);font-size:clamp(20px,4vw,26px);letter-spacing:-.2px}
  .opts{margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:11px;align-items:center;padding:12px 15px;border-radius:11px;
    border:1px solid var(--line);background:var(--s1);cursor:pointer;transition:.14s;
    font-size:14.2px;color:var(--tx2);text-align:left;width:100%;font-family:var(--sans);line-height:1.6}
  .opt:hover{background:var(--s2);border-color:var(--line2);color:var(--tx)}
  .opt .k{font-family:var(--mono);font-size:10.5px;color:var(--tx3);border:1px solid var(--line2);
    border-radius:5px;padding:0 5px;flex:none;line-height:1.7}
  .opt.mono{font-family:var(--mono);font-size:14.5px}
  .opt.right{border-color:rgba(53,196,106,.6);background:rgba(53,196,106,.12);color:#93f0b6}
  .opt.right .k{border-color:rgba(53,196,106,.5);color:#93f0b6}
  .opt.wrong{border-color:rgba(240,80,60,.6);background:rgba(240,80,60,.12);color:#ffb3a8}
  .opt.wrong .k{border-color:rgba(240,80,60,.5);color:#ffb3a8}
  .opt.dim{opacity:.4}
  .qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:12.5px;color:var(--tx3)}
  .qres{font-size:13px;margin-top:12px;line-height:1.8;display:none}
  .qres.on{display:block}
  .qres b{color:var(--grn)} .qres i{color:#ff8a7a;font-style:normal}

  /* ---------- typing ---------- */
  .tinput{width:100%;font-family:var(--mono);font-size:22px;background:#0a0e15;border:1px solid var(--line2);
    color:var(--tx);padding:13px 16px;border-radius:12px;outline:none;margin-top:18px;transition:.15s;
    letter-spacing:.5px}
  .tinput::placeholder{color:#3d4658;font-size:14px;letter-spacing:0}
  .tinput:focus{border-color:var(--blu);box-shadow:0 0 0 3px rgba(79,140,255,.13)}
  .tinput.ok{border-color:var(--grn);background:rgba(53,196,106,.06);box-shadow:0 0 0 3px rgba(53,196,106,.13)}
  .tinput.bad{border-color:var(--red);background:rgba(240,80,60,.06);box-shadow:0 0 0 3px rgba(240,80,60,.13)}
  .thint{font-family:var(--mono);font-size:13px;color:var(--tx3);letter-spacing:.3em;margin-top:14px}
  .tact{display:flex;gap:9px;margin-top:14px}

  /* ---------- wrong book ---------- */
  .wrow{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid #1a1f2b;font-size:13.6px}
  .wrow:last-child{border-bottom:0}
  .wrow .c{font-family:var(--mono);color:#ffc98b;flex:none;width:110px}
  .wrow .d{color:var(--tx2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow .n{font-family:var(--mono);font-size:11.5px;color:#ff8a7a;flex:none}

  @media(max-width:640px){
    main{padding:14px 13px 24px}
    .bar{padding:10px 13px;gap:8px}
    .brand em{display:none}
    .face{padding:22px 20px}
    .grid{grid-template-columns:1fr 1fr}
    .card{height:min(430px,60vh)}
    .desc{font-size:20px}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header class="bar">
    <div class="brand">
      <span class="logo">$_</span>
      <div><b>命令卡</b><em>LINUX COMMANDS</em></div>
    </div>
    <div class="spacer"></div>
    <div class="pill" id="pToday">今日 <b>0</b></div>
    <div class="pill fire" id="pStreak">连续 0 天</div>
    <button class="ibtn" id="btnStats" title="统计（S）">▤</button>
  </header>
  <main>
    <div class="toolbar">
      <div class="seg" id="seg">
        <button data-mode="study" class="on">学习</button>
        <button data-mode="quiz">测验</button>
        <button data-mode="type">打字</button>
        <button data-mode="stats">统计</button>
      </div>
      <div class="spacer"></div>
      <select id="catSel"></select>
    </div>
    <div id="stage"></div>
  </main>
  <footer id="foot">
    <kbd class="k">空格</kbd> 翻面 / 下一个　<kbd class="k">1</kbd> 不认识　<kbd class="k">2</kbd> 模糊　<kbd class="k">3</kbd> 认识　<kbd class="k">R</kbd> 朗读
  </footer>
</div>

<script>
/* 词库： [命令, 分类, 释义, 语法, 例子, 易错点] */
const RAW = [
["ls","文件","列出目录内容","ls [选项] [路径]","ls -lh /var/log","-l 只列目录里的文件；看目录自身权限要 ls -ld"],
["cd","文件","切换当前工作目录","cd 路径","cd /var/log","cd .. 上级；cd - 回上一个目录；cd ~ 家目录"],
["pwd","文件","显示当前所在目录的绝对路径","pwd","pwd","迷路时的第一条命令"],
["mkdir","文件","创建目录","mkdir [-p] 目录","mkdir -p /data/dev","不加 -p 时父目录不存在会报错"],
["cp","文件","复制文件或目录","cp [-r] 源 目标","cp -a /etc/fstab /var/tmp/","-a 保留权限、属主和时间戳"],
["mv","文件","移动或重命名文件","mv 源 目标","mv a.txt /tmp/b.txt","重命名就是移动到同目录下的新名字"],
["rm","文件","删除文件或目录","rm [-rf] 目标","rm -rf /tmp/build","rf 组合最危险，敲之前先 ls 确认"],
["touch","文件","创建空文件或更新时间戳","touch 文件","touch /root/a.txt","文件已存在时只更新时间戳，不覆盖内容"],
["ln","文件","创建硬链接或软链接","ln [-s] 目标 链接名","ln -s /var/www/html /root/web","软链接建议写绝对路径，否则容易断链"],
["find","文件","按条件递归查找文件","find 路径 [条件] [-exec 命令 {} \\;]","find /var -type f -size +5M","-exec 结尾的 \\; 是转义分号，不能省"],
["stat","文件","查看文件详细元数据与时间戳","stat 文件","stat /etc/passwd","能看 inode、权限、atime/mtime/ctime"],
["du","文件","统计目录或文件占用空间","du [-sh] 路径","du -sh /var/log","和 df 不同：du 看实际占用，df 看文件系统总量"],
["tree","文件","树形展示目录结构","tree [-L 层数] 目录","tree -L 2 /etc","默认可能没装，dnf install tree"],
["basename","文件","取出路径的最后一段","basename 路径","basename /etc/httpd/conf/httpd.conf","写脚本取文件名时很常用"],
["dirname","文件","取出路径的目录部分","dirname 路径","dirname /etc/httpd/conf/httpd.conf","和 basename 正好互补"],
["tar","文件","打包与解包归档文件","tar -czf 包 源 / -xzf 包","tar -czf /root/etc.tar.gz /etc","c 建 x 解 t 看；z=gzip j=bzip2 J=xz"],
["gzip","文件","用 gzip 压缩单个文件","gzip 文件","gzip /var/log/big.log","会删掉原文件，想保留用 -k"],
["bzip2","文件","用 bzip2 压缩单个文件","bzip2 文件","bzip2 -k big.txt","压缩率比 gzip 高但更慢；tar 里对应 -j"],

["cat","文本","查看文件内容或拼接输出","cat 文件","cat /etc/hostname","适合短文件，长文件用 less"],
["less","文本","分页浏览大文件","less 文件","less /var/log/messages","空格翻页、/搜索、q 退出"],
["head","文本","查看文件开头若干行","head [-n 行数] 文件","head -20 /etc/passwd","默认 10 行"],
["tail","文本","查看文件末尾，-f 可实时跟踪","tail [-f] [-n 行数] 文件","tail -f /var/log/messages","-f 跟踪日志，Ctrl+C 停止"],
["grep","文本","按模式搜索文本行","grep [选项] 模式 文件","grep -rn 'error' /var/log","-i 忽略大小写 -v 反向 -c 计数 -E 扩展正则"],
["sed","文本","流编辑器，逐行做替换修改","sed [-i] 's/旧/新/g' 文件","sed -i 's/80/8888/' /etc/httpd/conf/httpd.conf","-i 是原地修改，没有 -i 只打印不保存"],

const WORDS = RAW.map(([c,k,d,s,e,n])=>({c,k,d,s,e,n:n||''}));
</script>
<script>
/* ================= 状态 ================= */
const KEY = 'cmdcard-v1';
const DAY = 86400000;
const BOX_MS = [0, 10*60*1000, 1*DAY, 3*DAY, 7*DAY, 21*DAY];
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const today = () => todayStr();

let S = { w:{}, days:{}, last:'', streak:0, goalNew:15, cat:'全部' };
try { const r = JSON.parse(localStorage.getItem(KEY)||'{}'); S = Object.assign(S, r); } catch(e) {}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const CATS = ['全部', ...new Set(WORDS.map(w=>w.k))];
const COLORS = {'文件':'#4f8cff','文本':'#38d3d3','权限':'#a97bff','用户':'#ff8ab3',
  '系统':'#f0a05a','软件':'#5ad1a0','存储':'#f0c56a','网络':'#6ba8ff','安全':'#ff7a7a','时间':'#9fb4d8'};
function tint(el, k){
  const c = COLORS[k] || '#4f8cff';
  el.textContent = k;
  el.style.color = c;
  el.style.borderColor = c + '4d';
  el.style.background = c + '17';
}
const byCmd = {};
WORDS.forEach(w=>byCmd[w.c]=w);

let queue = [], qi = 0, total = 0, flipped = false, lock = false, mode = 'study';

/* ================= 会话 ================= */
function dayRec(){ return S.days[today()] || {n:0,r:0}; }

let poolOverride = null;
function buildQueue(){
  const pool = poolOverride
    ? WORDS.filter(w => poolOverride.includes(w.c))
    : WORDS.filter(w => S.cat==='全部' || w.k===S.cat);
  const now = Date.now();
  const due = [], fresh = [];
  pool.forEach(w=>{
    const st = S.w[w.c];
    if(!st) fresh.push(w.c);
    else if(st.d <= now) due.push({c:w.c,d:st.d});
  });
  due.sort((a,b)=>a.d-b.d);
  // 新词打散，避免同分类扎堆
  for(let i=fresh.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fresh[i],fresh[j]]=[fresh[j],fresh[i]]; }
  const newLeft = Math.max(0, S.goalNew - dayRec().n);
  queue = [...fresh.slice(0,newLeft), ...due.map(x=>x.c)].slice(0, 40);
  total = queue.length;
  qi = 0;
  if(!queue.length){                       // 没有待学内容时，抽 10 张最不熟的复习
    queue = pool.map(w=>w.c).sort((a,b)=>(S.w[a]?.b??-1)-(S.w[b]?.b??-1)).slice(0,10);
    total = queue.length;
  }
}

/* ================= 学习页 ================= */
function renderStudy(){
  buildQueue();
  const stage = $('#stage');
  if(!queue.length){ stage.innerHTML = doneHTML('词库是空的'); return; }
  stage.innerHTML = `
    <div class="sprog"><b id="spTx">1 / ${total}</b><div class="tr"><i id="spBar"></i></div><span id="spLeft"></span></div>
    <div class="card" id="card">
      <div class="inner">
        <div class="face front">
          <div class="chip" id="chipF">—</div>
          <div class="cmd" id="cmdTx">—</div>
          <button class="say" id="sayBtn">◍ 听读音 <kbd class="k">R</kbd></button>
          <div class="hintline">点击卡片翻面 · 或按空格</div>
        </div>
        <div class="face back">
          <div class="chip" id="chipB">—</div>
          <div class="bwrap">
            <div class="desc" id="descTx">—</div>
            <div class="row"><span class="lb">语法</span><code id="synTx"></code></div>
            <div class="row ex"><span class="lb">例子</span><code id="egTx"></code></div>
            <div class="note" id="noteTx" style="display:none"></div>
            <div class="rel" id="relTx"></div>
          </div>
          <div class="bmeta"><span id="boxTx">熟练度 ○○○○○</span><span>按 1 / 2 / 3 评价</span></div>
        </div>
      </div>
    </div>
    <div class="grade" id="grade">
      <button class="g1" data-g="1">不认识<kbd>1</kbd></button>
      <button class="g2" data-g="2">模糊<kbd>2</kbd></button>
      <button class="g3" data-g="3">认识<kbd>3</kbd></button>
    </div>`;
  $('#card').addEventListener('click', e=>{
    if(e.target.closest('#sayBtn')) return;
    toggleFlip();
  });
  $('#sayBtn').addEventListener('click', e=>{ e.stopPropagation(); speak(); });
  $('#grade').addEventListener('click', e=>{
    const b = e.target.closest('[data-g]'); if(b) grade(+b.dataset.g);
  });
  paintCard();
}

function paintCard(){
  const c = queue[qi];
  if(!c){ $('#stage').innerHTML = doneHTML(); bindDone(); return; }
  const w = byCmd[c];
  tint($('#chipF'), w.k);
  tint($('#chipB'), w.k);
  $('#cmdTx').textContent = w.c;
  $('#descTx').textContent = w.d;
  $('#synTx').textContent = w.s;
  $('#egTx').textContent = w.e;
  const nt = $('#noteTx');
  if(w.n){ nt.style.display='block'; nt.textContent = '⚠ ' + w.n; } else { nt.style.display='none'; }

  const box = (S.w[c]?.b) || 0;
  $('#boxTx').textContent = '熟练度 ' + '●'.repeat(box) + '○'.repeat(5-box);

  const rel = WORDS.filter(x=>x.k===w.k && x.c!==w.c).slice(0,4).map(x=>`<span>${x.c}</span>`).join('');
  $('#relTx').innerHTML = rel ? `<em>同类</em>${rel}` : '';

  $('#spTx').textContent = Math.min(qi+1,total) + ' / ' + total;
  $('#spBar').style.width = (qi/Math.max(total,1)*100) + '%';
  const dc = dayRec();
  $('#spLeft').textContent = `今日 新 ${dc.n} · 复习 ${dc.r}`;
  $('#grade').classList.remove('on');
  flipped = false;
  $('#card').classList.remove('flip');
  lock = false;
  updateHeader();
}

function toggleFlip(){
  if(lock) return;
  flipped = !flipped;
  $('#card').classList.toggle('flip', flipped);
  $('#grade').classList.toggle('on', flipped);
  if(flipped) speak();
}

function speak(){
  if(!('speechSynthesis' in window)) return;
  const c = queue[qi]; if(!c) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(c.replace(/[^a-zA-Z0-9 ]/g,' '));
  u.lang = 'en-US'; u.rate = .85;
  const vs = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
  if(vs.length) u.voice = vs.find(v=>/Samantha|Alex|Google US English|Microsoft/.test(v.name)) || vs[0];
  const btn = $('#sayBtn');
  if(btn){ btn.classList.add('playing'); u.onend = ()=>btn.classList.remove('playing'); }
  speechSynthesis.speak(u);
}

function grade(g){
  if(lock || !flipped) return;
  const c = queue[qi]; if(!c) return;
  lock = true;

  const st = S.w[c] || {b:0,d:0,s:0,ok:0,no:0};
  const isNew = !S.w[c];
  st.s++;
  if(g===1){ st.no++; st.b = 0; st.d = Date.now() + 5*60*1000; }
  else if(g===2){ st.no += 0; st.b = Math.max(1, st.b); st.d = Date.now() + (st.b<2 ? 30*60*1000 : 1*DAY); }
  else { st.ok++; st.b = Math.min(5, st.b+1); st.d = Date.now() + BOX_MS[st.b]; }
  S.w[c] = st;

  const t = today();
  if(!S.days[t]) S.days[t] = {n:0,r:0};
  if(isNew) S.days[t].n++; else S.days[t].r++;
  markStreak();
  save();

  // 不认识 → 本轮稍后再出现一次
  if(g===1 && qi + 3 < queue.length){ queue.splice(qi+3, 0, c); total++; }

  $('#card').classList.remove('flip');
  $('#grade').classList.remove('on');
  flipped = false;
  qi++;
  setTimeout(()=>{ if(qi >= queue.length){ $('#stage').innerHTML = doneHTML(); bindDone(); } else paintCard(); }, 320);
}

function markStreak(){
  const t = today();
  if(S.last === t) return;
  const y = new Date(Date.now()-DAY);
  const ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  S.streak = (S.last === ys) ? (S.streak||0)+1 : 1;
  S.last = t;
}

function doneHTML(msg){
  const dc = dayRec();
  return `<div class="done">
    <div class="big">✓</div>
    <h2>${msg || '今天的卡背完了'}</h2>
    <p>本次 ${total} 张　今日新词 ${dc.n} / ${S.goalNew}　复习 ${dc.r}</p>
    <div class="acts">
      <button class="btn primary" data-act="again">再来 10 张</button>
      <button class="btn" data-act="stats">看统计</button>
    </div>
  </div>`;
}
function bindDone(){ updateHeader(); }

/* ================= 统计页 ================= */
function renderStats(){
  const st = Object.values(S.w);
  const learned = st.length;
  const mastered = st.filter(x=>x.b>=4).length;
  const learning = st.filter(x=>x.b>0 && x.b<4).length;
  const dueN = WORDS.filter(w=>S.w[w.c] && S.w[w.c].d<=Date.now()).length;
  const dc = dayRec();

  const cats = CATS.slice(1).map(k=>{
    const all = WORDS.filter(w=>w.k===k);
    const got = all.filter(w=>S.w[w.c]).length;
    return {k, all:all.length, got, pct: Math.round(got/all.length*100)};
  });

  $('#stage').innerHTML = `
    <div class="grid">
      <div class="stat"><b style="color:var(--blu)">${learned}</b><span>已学 / ${WORDS.length}</span></div>
      <div class="stat"><b style="color:var(--grn)">${mastered}</b><span>已掌握</span></div>
      <div class="stat"><b style="color:var(--amb)">${dueN}</b><span>待复习</span></div>
      <div class="stat"><b style="color:var(--vio)">${S.streak||0}</b><span>连续天数</span></div>
    </div>
    <div class="sectitle">分类进度（学过的命令 / 该类总数）</div>
    ${cats.map(c=>`<div class="catrow">
      <div class="h"><span>${c.k}</span><b>${c.got}/${c.all} · ${c.pct}%</b></div>
      <div class="b"><i style="width:${c.pct}%"></i></div></div>`).join('')}
    <div class="sectitle">错题本 · 答错过还没掌握</div>
    ${(()=>{ const wl = wrongList();
      if(!wl.length) return `<p style="font-size:13.5px;color:var(--tx3);margin-bottom:6px">还没有错题。测验或打字答错的命令会自动进这里。</p>`;
      return wl.slice(0,8).map(w=>`<div class="wrow"><span class="c">${esc(w.c)}</span>
        <span class="d">${esc(w.d)}</span><span class="n">错 ${S.w[w.c].no}</span></div>`).join('')
        + (wl.length>8 ? `<div style="font-size:12px;color:var(--tx3);padding:8px 2px">…还有 ${wl.length-8} 个</div>` : '')
        + `<div class="acts" style="justify-content:flex-start;margin-top:14px">
             <button class="btn primary" data-act="drill">练这 ${wl.length} 个错题</button></div>`;
    })()}
    <div class="sectitle">今日</div>
    <p style="font-size:13.5px;color:var(--tx2);margin-bottom:20px">
      新词 ${dc.n} 张（目标 ${S.goalNew}）· 复习 ${dc.r} 张 · 学习中 ${learning} 个
    </p>
    <div class="acts" style="justify-content:flex-start">
      <button class="btn" data-act="back">回到学习</button>
      <button class="btn" data-act="reset">重置全部进度</button>
    </div>`;

  updateHeader();
}

/* ================= 测验 / 打字 / 错题 ================= */
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function bump(cmd, correct){
  const isNew = !S.w[cmd];
  const st = S.w[cmd] || {b:0,d:0,s:0,ok:0,no:0};
  st.s++;
  if(correct){ st.ok++; st.b = Math.min(5, st.b+1); st.d = Date.now() + BOX_MS[st.b]; }
  else { st.no++; st.b = 0; st.d = Date.now() + 5*60*1000; }
  S.w[cmd] = st;
  const t = today(); if(!S.days[t]) S.days[t] = {n:0,r:0};
  if(isNew) S.days[t].n++; else S.days[t].r++;
  markStreak(); save(); updateHeader();
}

function sessionPool(n){
  const pool = WORDS.filter(w => S.cat==='全部' || w.k===S.cat);
  const learned = shuffle(pool.filter(w=>S.w[w.c]));
  const fresh = shuffle(pool.filter(w=>!S.w[w.c]));
  return shuffle([...learned.slice(0, Math.ceil(n*0.7)), ...fresh.slice(0, n)]).slice(0,n).map(w=>w.c);
}

/* ---------- 四选一 ---------- */
let qz = null;
function makeOptions(w, reverse){
  const pool = WORDS.filter(x=>x.c!==w.c);
  const same = shuffle(pool.filter(x=>x.k===w.k));
  const other = shuffle(pool.filter(x=>x.k!==w.k));
  const picks = [], used = new Set([reverse ? w.c : w.d]);
  for(const x of [...same, ...other]){
    if(picks.length>=3) break;
    const key = reverse ? x.c : x.d;
    if(!used.has(key)){ picks.push(x); used.add(key); }
  }
  return shuffle([w, ...picks]);
}
function startQuiz(){ qz = {list: sessionPool(10), i:0, right:0, opts:null, for:null, answered:false}; renderQuiz(); }

function renderQuiz(){
  if(!qz) return startQuiz();
  const stage = $('#stage');
  if(qz.i >= qz.list.length){
    stage.innerHTML = `<div class="done"><div class="big">${qz.right>=8?'✓':'◔'}</div>
      <h2>测验完成</h2><p>${qz.list.length} 题答对 <b style="color:var(--grn)">${qz.right}</b> 题</p>
      <div class="acts"><button class="btn primary" data-act="quizAgain">再来一轮</button>
      <button class="btn" data-act="stats">看统计</button></div></div>`;
    updateHeader(); return;
  }
  const c = qz.list[qz.i], w = byCmd[c];
  const reverse = qz.i % 2 === 1;
  if(qz.for !== c){ qz.for = c; qz.opts = makeOptions(w, reverse); qz.answered = false; }

  stage.innerHTML = `
    <div class="sprog"><b>${qz.i+1} / ${qz.list.length}</b><div class="tr"><i style="width:${qz.i/qz.list.length*100}%"></i></div><span>答对 ${qz.right}</span></div>
    <div class="qcard">
      <div class="qlabel">${reverse ? '看意思，选命令' : '看命令，选意思'}　·　${w.k}</div>
      <div class="qprompt ${reverse?'cn':''}">${reverse ? esc(w.d) : esc(w.c)}</div>
      <div class="opts" id="opts">
        ${qz.opts.map((o,i)=>`<button class="opt ${reverse?'mono':''}" data-i="${i}">
          <span class="k">${i+1}</span><span>${esc(reverse ? o.c : o.d)}</span></button>`).join('')}
      </div>
      <div class="qres" id="qres"></div>
    </div>
    <div class="qfoot"><span>按 1–4 作答</span><span id="qnext"></span></div>`;
  bindQuiz(w, reverse);
  updateHeader();
}

function bindQuiz(w, reverse){
  const wrap = $('#opts');
  wrap.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b || qz.answered) return;
    answerQuiz(+b.dataset.i, w, reverse);
  });
}
function answerQuiz(idx, w, reverse){
  qz.answered = true;
  const correct = qz.opts[idx].c === w.c;
  const nodes = [...document.querySelectorAll('#opts .opt')];
  nodes.forEach((n,i)=>{
    if(qz.opts[i].c === w.c) n.classList.add('right');
    else if(i === idx) n.classList.add('wrong');
    else n.classList.add('dim');
    n.style.pointerEvents = 'none';
  });
  const res = $('#qres');
  res.classList.add('on');
  if(correct){ qz.right++; res.innerHTML = `<b>答对了</b>　${esc(w.c)} — ${esc(w.d)}`; }
  else res.innerHTML = `<i>答错了</i>　正确答案是 <b style="color:var(--tx)">${esc(reverse?w.c:w.d)}</b><br>
    <span style="color:var(--tx2)">${esc(w.c)} — ${esc(w.d)}</span>
    <div style="margin-top:8px;font-family:var(--mono);font-size:12.5px;color:#8fd9c0">${esc(w.s)}</div>`;
  bump(w.c, correct);
  $('#qnext').innerHTML = `<button class="btn primary" style="padding:7px 16px" data-act="qnext">下一题</button>`;
  if(correct) setTimeout(()=>{ if(qz.answered) nextQuiz(); }, 850);
}
function nextQuiz(){ qz.i++; qz.for = null; qz.answered = false; renderQuiz(); }

/* ---------- 打字 ---------- */
let tp = null;
function startType(){ tp = {list: sessionPool(10), i:0, right:0, tries:0, done:false}; renderType(); }
function renderType(){
  if(!tp) return startType();
  const stage = $('#stage');
  if(tp.i >= tp.list.length){
    stage.innerHTML = `<div class="done"><div class="big">${tp.right>=8?'✓':'◔'}</div>
      <h2>打字练习完成</h2><p>${tp.list.length} 题拼对 <b style="color:var(--grn)">${tp.right}</b> 题</p>
      <div class="acts"><button class="btn primary" data-act="typeAgain">再来一轮</button>
      <button class="btn" data-act="stats">看统计</button></div></div>`;
    updateHeader(); return;
  }
  const c = tp.list[tp.i], w = byCmd[c];
  const mask = c[0] + '·'.repeat(Math.max(0, c.length-1));
  stage.innerHTML = `
    <div class="sprog"><b>${tp.i+1} / ${tp.list.length}</b><div class="tr"><i style="width:${tp.i/tp.list.length*100}%"></i></div><span>拼对 ${tp.right}</span></div>
    <div class="qcard">
      <div class="qlabel">看释义，拼出命令　·　${w.k}</div>
      <div class="qprompt cn">${esc(w.d)}</div>
      <div class="thint">${mask}　共 ${c.length} 个字符</div>
      <input class="tinput" id="tinput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入命令后回车">
      <div class="qres" id="tres"></div>
      <div class="tact" id="tact"></div>
    </div>
    <div class="qfoot"><span>Enter 提交 · 答错会显示答案</span><span>共 ${tp.list.length} 题</span></div>`;
  const inp = $('#tinput');
  inp.focus();
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitType(); });
  updateHeader();
}
function submitType(){
  const inp = $('#tinput'); if(!inp || tp.done) return;
  const c = tp.list[tp.i], w = byCmd[c];
  const val = inp.value.trim().toLowerCase();
  if(!val) return;
  const ok = val === c.toLowerCase();
  tp.done = true;
  inp.classList.add(ok?'ok':'bad');
  inp.setAttribute('readonly','');
  const res = $('#tres'); res.classList.add('on');
  if(ok){
    tp.right++;
    res.innerHTML = `<b>正确</b>　${esc(w.c)} — ${esc(w.d)}`;
    bump(c, true);
  } else {
    res.innerHTML = `<i>没拼对</i>　正确答案：<b style="color:var(--tx)">${esc(w.c)}</b><br>
      <span style="color:var(--tx2)">${esc(w.d)}</span>
      <div style="margin-top:8px;font-family:var(--mono);font-size:12.5px;color:#8fd9c0">${esc(w.s)}</div>`;
    bump(c, false);
  }
  $('#tact').innerHTML = `<button class="btn primary" style="padding:8px 18px" data-act="tnext">下一题</button>`;
  if(ok) setTimeout(()=>{ if(tp.done) nextType(); }, 900);
}
function nextType(){ tp.i++; tp.done = false; renderType(); }

/* ---------- 错题本 ---------- */
function wrongList(){
  return WORDS.filter(w=>{ const s=S.w[w.c]; return s && s.no>0 && s.b<3; })
    .sort((a,b)=> (S.w[b.c].no||0)-(S.w[a.c].no||0));
}

/* ================= 头部 / 模式 ================= */
function updateHeader(){
  const dc = dayRec();
  const n = dc.n + dc.r;
  $('#pToday').innerHTML = `今日 <b>${n}</b>`;
  $('#pStreak').textContent = `连续 ${S.streak||0} 天`;
}
function setMode(m){
  mode = m;
  if(m !== 'study') poolOverride = null;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  const FT={study:'<kbd class="k">空格</kbd> 翻面　<kbd class="k">1</kbd> 不认识　<kbd class="k">2</kbd> 模糊　<kbd class="k">3</kbd> 认识　<kbd class="k">R</kbd> 朗读',quiz:'<kbd class="k">1</kbd>–<kbd class="k">4</kbd> 选择答案　<kbd class="k">Enter</kbd> 下一题',type:'直接输入命令，<kbd class="k">Enter</kbd> 提交',stats:'<kbd class="k">S</kbd> 回到学习'};
  const f=document.getElementById('foot'); if(f) f.innerHTML=FT[m]||'';
  if(m==='study') renderStudy();
  else if(m==='quiz') (qz && qz.i < qz.list.length) ? renderQuiz() : startQuiz();
  else if(m==='type') (tp && tp.i < tp.list.length) ? renderType() : startType();
  else renderStats();
}

/* ================= 初始化 ================= */
(function init(){
  const sel = $('#catSel');
  sel.innerHTML = CATS.map(c=>`<option ${c===S.cat?'selected':''}>${c}</option>`).join('');
  sel.addEventListener('change', ()=>{ S.cat = sel.value; save(); if(mode==='study') renderStudy(); });
  syncVoices(); updateHeader();
  setMode('study');

  document.querySelectorAll('#seg button').forEach(b=>{
    b.addEventListener('click', ()=>{ poolOverride = null; setMode(b.dataset.mode); });
  });
  $('#btnStats').addEventListener('click', ()=>setMode(mode==='stats'?'study':'stats'));

  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    const a = b.dataset.act;
    if(a==='again'){ S.goalNew += 10; save(); renderStudy(); }
    if(a==='stats'){ setMode('stats'); }
    if(a==='back'){ setMode('study'); }
    if(a==='qnext'){ nextQuiz(); }
    if(a==='tnext'){ nextType(); }
    if(a==='quizAgain'){ startQuiz(); }
    if(a==='typeAgain'){ startType(); }
    if(a==='drill'){
      const list = wrongList().map(w=>w.c);
      if(!list.length) return;
      poolOverride = list; setMode('study');
    }
    if(a==='reset' && confirm('清空所有学习记录？此操作不可撤销。')){
      S = { w:{}, days:{}, last:'', streak:0, goalNew:15, cat:'全部' };
      save(); renderStats();
    }
  });

  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='SELECT') return;
    if(mode==='quiz'){
      if(/^[1-4]$/.test(e.key)){
        const b = document.querySelector(`#opts .opt[data-i="${+e.key-1}"]`);
        if(b && qz && !qz.answered) b.click();
        return;
      }
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if(qz && qz.answered) nextQuiz(); }
      return;
    }
    if(mode==='type') return;                    // 输入框自己处理 Enter
    if(mode!=='study'){ if(e.key==='s'||e.key==='S') setMode('study'); return; }
    if(e.key===' '){ e.preventDefault(); toggleFlip(); return; }
    if(e.key==='1'||e.key==='2'||e.key==='3'){ grade(+e.key); return; }
    if(e.key==='r'||e.key==='R'){ speak(); }
  });
  function syncVoices(){ if('speechSynthesis' in window) speechSynthesis.getVoices(); }
  if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = syncVoices;
})();
</script>
</body>
</html>
